# Lance tous les essais qui se passent d'IA et de compte (tests/tout.sh) : sur chaque demande de fusion, et sur main.
# Aucun secret n'est utilisé ici ; aucune IA n'est appelée (fausses IA de tests/faux, navigateur simulé).
name: Essais

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  essais:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash tests/tout.sh
