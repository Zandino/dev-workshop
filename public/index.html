<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Dev Workshop</title>
  <link rel="icon" href="/icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/disposition.css">
  <link rel="stylesheet" href="/css/messages.css">
  <link rel="stylesheet" href="/css/panneaux.css">
  <link rel="stylesheet" href="/css/direct.css">
  <link rel="stylesheet" href="/css/equipe.css">
</head>
<body>
  <div id="bandeau" class="bandeau" hidden data-i18n="connexion_perdue"></div>

  <div class="atelier">
    <aside class="barre">
      <div class="marque">dev-workshop</div>

      <section class="extensible">
        <h2 data-i18n="projets"></h2>
        <div id="liste-projets" class="liste"></div>
        <form id="form-projet" class="ajout">
          <input id="nom-projet" type="text" maxlength="60" autocomplete="off" data-i18n-attr="placeholder:nouveau_projet">
          <button type="submit" data-i18n="creer"></button>
        </form>
      </section>

      <section id="bloc-vivantes" hidden>
        <h2 data-i18n="en_cours"></h2>
        <div id="liste-vivantes" class="liste"></div>
      </section>

      <section id="bloc-interrompues" hidden>
        <h2 data-i18n="interrompues"></h2>
        <div id="liste-interrompues" class="liste"></div>
      </section>


      <footer>
        <div class="liens-barre">
          <button id="ouvrir-discussions" class="discret" type="button" data-i18n="toutes_discussions"></button>
          <button id="ouvrir-connecteurs" class="discret" type="button" data-i18n="connecteurs"></button>
          <button id="ouvrir-corbeille" class="discret" type="button"><span data-i18n="corbeille"></span> <span id="compte-corbeille" class="nombre"></span></button>
        </div>
        <label><span data-i18n="langue"></span><select id="langue"></select></label>
        <label><span data-i18n="dictee"></span><select id="dictee-moteur"></select></label>
        <label><span data-i18n="voix_reglage"></span><select id="voix-mode"></select></label>
      </footer>
    </aside>

    <main class="scene">
      <header class="entete">
        <h1 id="titre-session"></h1>
        <!-- Boutons en icônes : le texte reste lu par les lecteurs d'écran et s'affiche en info-bulle. -->
        <button id="nouvelle" class="icone-entete" type="button" data-i18n-attr="title:nouvelle_session"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="lu" data-i18n="nouvelle_session"></span></button>
        <button id="fermer-session" class="icone-entete" type="button" hidden data-i18n-attr="title:fermer_session"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg><span class="lu" data-i18n="fermer_session"></span></button>
        <button id="retenir" class="icone-entete" type="button" hidden data-i18n-attr="title:retenir_bouton"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span class="lu" data-i18n="retenir_bouton"></span></button>
        <span class="ressort"></span>
        <button id="ouvrir-apercu" class="icone-entete" type="button" data-i18n-attr="title:apercu"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M14 4v16"/></svg><span class="lu" data-i18n="apercu"></span></button>
        <button id="ouvrir-direct" class="icone-entete" type="button" data-i18n-attr="title:equipe"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2"/><path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8"/></svg><span class="lu" data-i18n="equipe"></span></button>
        <button id="ouvrir-salon" class="icone-entete" type="button" data-i18n-attr="title:salon_bouton"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 19c0-3.3 2.7-5 6-5s6 1.7 6 5M15 14.5c2.8 0 5 1.4 5 4.5"/></svg><span class="lu" data-i18n="salon_bouton"></span></button>
        <button id="ouvrir-comptes" class="icone-entete" type="button" data-i18n-attr="title:comptes"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/></svg><span class="lu" data-i18n="comptes"></span></button>
        <label><span data-i18n="fournisseur"></span><span id="logo-compte" class="logo-entete"></span><select id="compte"></select></label>
        <label><span data-i18n="modele"></span><select id="modele"></select></label>
        <button id="jauge" class="jauge" type="button" data-i18n-attr="title:conso_titre"></button>
      </header>

      <section id="conso" class="panneau-conso" hidden></section>
      <div id="fil" class="fil"></div>
      <div id="permissions" class="permissions"></div>
      <div id="travail" class="travail" hidden></div>

      <footer class="saisie">
        <div id="palette" class="palette" hidden></div>
        <div id="pieces" class="pieces" hidden></div>
        <button id="joindre" class="joindre" type="button" disabled data-i18n-attr="title:joindre"><span aria-hidden="true">+</span></button>
        <input id="fichier-joint" type="file" multiple hidden>
        <textarea id="champ" rows="1" disabled data-i18n-attr="placeholder:saisie"></textarea>
        <label class="pastille-reglage"><span data-i18n="mode"></span><select id="mode"></select></label>
        <label class="pastille-reglage"><span data-i18n="puissance"></span><select id="effort"></select></label>
        <span class="ressort"></span>
        <button id="dicter" class="dicter" type="button" disabled data-i18n-attr="title:dicter"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg><span id="dicter-temps" class="temps"></span></button>
        <button id="arreter" class="danger" type="button" hidden data-i18n="arreter"></button>
        <button id="envoyer" class="principal" type="button" disabled data-i18n="envoyer"></button>
      </footer>

      <footer class="pied">
        <span>dev-workshop <span id="version"></span></span>
        <span>Apache 2.0</span>
        <a href="https://github.com/Zandino/dev-workshop" target="_blank" rel="noopener noreferrer" data-i18n="code_source"></a>
        <span class="ressort"></span>
        <span data-i18n="pied_serveur"></span>
      </footer>
    </main>
    <aside id="apercu" class="apercu" hidden></aside>
    <aside id="equipe" class="equipe" hidden></aside>
  </div>

  <div id="panneau-comptes" class="voile" hidden></div>
  <div id="panneau-salon" class="voile" hidden></div>
  <div id="panneau-projet" class="voile" hidden></div>
  <div id="panneau-connecteurs" class="voile" hidden></div>
  <div id="panneau-discussions" class="voile" hidden></div>

  <div id="porte" class="porte" hidden>
    <form id="form-porte">
      <h2 data-i18n="jeton_titre"></h2>
      <p data-i18n="jeton_aide"></p>
      <p id="porte-erreur" class="erreur" hidden data-i18n="jeton_refuse"></p>
      <input id="porte-jeton" type="password" autocomplete="off" required data-i18n-attr="placeholder:jeton_champ">
      <button class="principal" type="submit" data-i18n="entrer"></button>
    </form>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
