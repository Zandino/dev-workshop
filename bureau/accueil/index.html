<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Dev Workshop</title>
  <link rel="stylesheet" href="accueil.css">
</head>
<body>
  <main class="page">
    <header class="tete">
      <div class="logo" aria-hidden="true"></div>
      <div>
        <h1 data-t="titre"></h1>
        <p class="doux" data-t="sous_titre"></p>
      </div>
    </header>

    <section>
      <div class="section-tete">
        <h2 data-t="serveurs"></h2>
        <div class="boutons">
          <button id="ouvrir-guide" class="discret" type="button" data-t="guide_ouvrir"></button>
          <button id="ajouter" class="principal" type="button" data-t="ajouter"></button>
        </div>
      </div>
      <p id="vide" class="vide" hidden data-t="aucun_serveur"></p>
      <div id="liste" class="liste"></div>
    </section>

    <footer class="pied">
      <label class="case"><input id="maj-auto" type="checkbox"><span data-t="maj_auto"></span></label>
      <span data-t="pied"></span>
      <a id="code-source" href="#" data-t="code_source"></a>
      <a id="confidentialite" href="#" data-t="confidentialite"></a>
    </footer>
  </main>

  <dialog id="formulaire">
    <form id="form-serveur" method="dialog">
      <h2 id="form-titre"></h2>
      <p id="form-erreur" class="erreur" hidden></p>
      <label><span data-t="nom"></span><input name="nom" maxlength="40" autocomplete="off" required><small data-t="nom_aide"></small></label>
      <label><span data-t="hote"></span><input name="hote" maxlength="120" autocomplete="off" spellcheck="false" required placeholder="mon-serveur"><small data-t="hote_aide"></small></label>
      <div class="deux">
        <label><span data-t="port_ssh"></span><input name="portSsh" inputmode="numeric" autocomplete="off" placeholder="22"></label>
        <label><span data-t="port"></span><input name="port" inputmode="numeric" autocomplete="off" placeholder="5330"></label>
      </div>
      <small class="doux" data-t="port_ssh_aide"></small>
      <label><span data-t="dossier"></span><input name="dossier" autocomplete="off" spellcheck="false" placeholder="~/dev-workshop"><small data-t="dossier_aide"></small></label>
      <label><span data-t="racine"></span><input name="racine" autocomplete="off" spellcheck="false" placeholder="~/dev"><small data-t="racine_aide"></small></label>
      <div class="actions">
        <button id="form-annuler" type="button" data-t="annuler"></button>
        <button class="principal" type="submit" data-t="enregistrer"></button>
      </div>
    </form>
  </dialog>

  <dialog id="guide">
    <div class="guide">
      <h2 data-t="guide_titre"></h2>
      <section>
        <h3 data-t="guide_1_titre"></h3>
        <p class="doux" data-t="guide_1_texte"></p>
      </section>
      <section>
        <h3 data-t="guide_2_titre"></h3>
        <p id="guide-cle"></p>
        <button id="guide-creer-cle" type="button" data-t="guide_creer_cle" hidden></button>
        <small class="doux" data-t="guide_2_aide"></small>
      </section>
      <section>
        <h3 data-t="guide_3_titre"></h3>
        <div class="deux">
          <label><span data-t="hote"></span><input id="guide-hote" maxlength="120" autocomplete="off" spellcheck="false" placeholder="moi@mon-serveur"></label>
          <label><span data-t="port_ssh"></span><input id="guide-port" inputmode="numeric" autocomplete="off" placeholder="22"></label>
        </div>
        <button id="guide-deposer" type="button" data-t="guide_deposer" hidden></button>
        <small class="doux" id="guide-aide-terminal" data-t="guide_3_aide" hidden></small>
        <p class="doux" data-t="guide_3_manuel"></p>
        <div class="commande"><pre id="guide-commande"></pre><button id="guide-copier" class="discret" type="button" data-t="copier"></button></div>
        <p id="guide-depot" class="message" hidden></p>
      </section>
      <section>
        <h3 data-t="guide_4_titre"></h3>
        <button id="guide-tester" type="button" data-t="guide_tester"></button>
        <p id="guide-test" class="message" hidden></p>
      </section>
      <section>
        <h3 data-t="guide_5_titre"></h3>
        <p class="doux" data-t="guide_5_texte"></p>
      </section>
      <div class="actions">
        <button id="guide-fermer" type="button" data-t="fermer"></button>
        <button id="guide-ajouter" class="principal" type="button" data-t="guide_ajouter"></button>
      </div>
    </div>
  </dialog>

  <script src="guide.js"></script>
  <script src="accueil.js"></script>
</body>
</html>
